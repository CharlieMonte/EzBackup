# =====================================================================================================
# Everything that changes between Minecraft versions, and between forks, lives in THIS file.
# build.gradle, mods.toml, pack.mcmeta and build.ps1 all read from here; nothing is repeated elsewhere.
# =====================================================================================================

# ---- Target game version (change these when porting) ------------------------------------------------
minecraft_version=1.18.2
forge_version=40.3.12

# Version ranges written into META-INF/mods.toml
minecraft_version_range=[1.18.2,1.19)
forge_version_range=[40,)
loader_version_range=[40,)

# Toolchain this Minecraft/Forge generation needs (Forge 40 / MC 1.18 = Java 17 + ForgeGradle 5.1 + Gradle 7.6)
# The Gradle version itself is set in gradle/wrapper/gradle-wrapper.properties.
java_version=17
forgegradle_version=5.1.+

# Resource pack format for pack.mcmeta (kept from the original; 1.18.2 officially uses 8, 1.19-1.19.2 use 9)
pack_format=8

# ---- This mod -----------------------------------------------------------------------------------------
# mod_id must match MOD_ID in EzBackup.java.
mod_id=ezbackup
mod_name=EzBackup
mod_version=1.0.0
mod_group=com.ezbackup
mod_main_class=com.ezbackup.EzBackup

# ---- Bundled compression libraries --------------------------------------------------------------------
# zstd-jni carries its own natives; build.gradle keeps only Windows x64, macOS (Apple Silicon + Intel) and Linux (x64 + ARM64) to keep the jar small.
zstd_jni_version=1.5.5-11

# ---- Gradle -------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
