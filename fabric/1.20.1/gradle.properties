# =====================================================================================================
# Everything that changes between Minecraft versions, and between forks, lives in THIS file.
# build.gradle, settings.gradle, fabric.mod.json and build.ps1 all read from here; nothing is repeated elsewhere.
# =====================================================================================================

# ---- Target game version (change these when porting) ------------------------------------------------
minecraft_version=1.20.1
fabric_loader_version=0.15.11
fabric_api_version=0.92.2+1.20.1

# Version ranges written into fabric.mod.json
minecraft_version_range=~1.20.1
loader_version_range=>=0.15.11

# Toolchain this Minecraft generation needs (MC 1.20.1 = Java 17 + Fabric Loom 1.6 + Gradle 8.6 or newer)
# The Gradle version itself is set in gradle/wrapper/gradle-wrapper.properties.
java_version=17
loom_version=1.6-SNAPSHOT

# ---- This mod -----------------------------------------------------------------------------------------
# mod_id must match MOD_ID in EzBackup.java.
mod_id=ezbackup
mod_name=EzBackup
# Mod loader name used in the jar file name: EzBackup-<mod_loader>-mc<minecraft_version>-<mod_version>.jar
mod_loader=fabric
mod_version=1.0.0
mod_group=com.ezbackup
mod_main_class=com.ezbackup.EzBackup

# ---- Bundled compression libraries --------------------------------------------------------------------
# zstd-jni carries its own natives; build.gradle keeps only Windows x64, macOS (Apple Silicon + Intel) and Linux (x64 + ARM64) to keep the jar small.
zstd_jni_version=1.5.5-11

# ---- Gradle -------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
