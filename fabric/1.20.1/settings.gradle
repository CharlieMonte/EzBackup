// The Loom (Fabric's Gradle plugin) version comes from gradle.properties (loom_version).
pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'fabric-loom' version loom_version
    }
}

rootProject.name = 'EzBackup'
