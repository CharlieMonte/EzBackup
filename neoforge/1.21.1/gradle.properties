# =====================================================================================================
# Everything that changes between Minecraft versions, and between forks, lives in THIS file.
# build.gradle, settings.gradle, neoforge.mods.toml, pack.mcmeta and build.ps1 all read from here; nothing is repeated elsewhere.
# =====================================================================================================

# ---- Target game version (change these when porting) ------------------------------------------------
minecraft_version=1.21.1
# NeoForge 21.1.x is the 1.21.1 line. Any 21.1.x release works; raise this number to update.
neo_version=21.1.172

# Version ranges written into META-INF/neoforge.mods.toml
minecraft_version_range=[1.21.1,1.22)
neo_version_range=[21.1.0,22)
loader_version_range=[1,)

# Toolchain this Minecraft generation needs (MC 1.21.1 / NeoForge 21.1 = Java 21 + ModDevGradle 2.x + Gradle 8.8 or newer)
# The Gradle version itself is set in gradle/wrapper/gradle-wrapper.properties.
java_version=21
moddevgradle_version=2.0.78

# Resource pack format for pack.mcmeta (1.21.1 uses 34; 1.20.1 used 15)
pack_format=34

# ---- This mod -----------------------------------------------------------------------------------------
# mod_id must match MOD_ID in EzBackup.java.
mod_id=ezbackup
mod_name=EzBackup
# Mod loader name used in the jar file name: EzBackup-<mod_loader>-mc<minecraft_version>-<mod_version>.jar
mod_loader=neoforge
mod_version=1.0.0
mod_group=com.ezbackup
mod_main_class=com.ezbackup.EzBackup

# ---- Bundled compression libraries --------------------------------------------------------------------
# zstd-jni carries its own natives; build.gradle keeps only Windows x64, macOS (Apple Silicon + Intel) and Linux (x64 + ARM64) to keep the jar small.
zstd_jni_version=1.5.5-11

# ---- Gradle -------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=false
